<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Caos Party V12 Cenários</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:white;text-align:center;background:
radial-gradient(circle at 12% 5%,#38bdf8 0%,transparent 30%),
radial-gradient(circle at 88% 10%,#f472b6 0%,transparent 26%),
radial-gradient(circle at 50% 100%,#22c55e 0%,transparent 32%),
linear-gradient(180deg,#0f172a 0%,#082f49 45%,#064e3b 100%);overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:12px}.active{display:block}
.card{max-width:1000px;margin:12px auto;padding:18px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.13));border:1px solid rgba(255,255,255,.26);box-shadow:0 20px 55px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(8px)}
.card:before{content:"";display:block;height:4px;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#facc15,#fb7185,#22c55e);margin-bottom:12px}
.title{font-size:42px;font-weight:1000;text-shadow:0 5px 0 rgba(0,0,0,.35)}
button,input,select{border:0;border-radius:16px;padding:12px 16px;margin:6px;font-weight:1000;font-size:15px}
button{background:#ffd43b;color:#111;box-shadow:0 5px 0 #9f7a00}button:active{transform:translateY(4px);box-shadow:0 1px 0 #9f7a00}
input{text-align:center;text-transform:uppercase;letter-spacing:3px}.blue{background:#38bdf8;box-shadow:0 5px 0 #075985}.green{background:#4ade80;box-shadow:0 5px 0 #166534}.ghost{background:rgba(255,255,255,.18);color:white;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.box{padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(15,23,42,.38),rgba(15,23,42,.20));border:1px solid rgba(255,255,255,.14)}
.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:900;margin:3px}.small{font-size:13px;opacity:.88}
#conn{font-weight:1000;margin:8px}.ok{color:#4ade80}.bad{color:#fb7185}.wait{color:#fde047}
#roomCode{font-size:46px;color:#ffd43b;letter-spacing:5px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px auto;max-width:820px}.slot{background:rgba(0,0,0,.25);border-radius:18px;padding:12px;text-align:left}.avatar{font-size:34px;margin-right:8px}
.charGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px;max-width:780px;margin:10px auto}.char{font-size:26px;padding:8px;background:rgba(255,255,255,.16);color:white;box-shadow:0 4px 0 rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.18)}.sel{outline:3px solid #ffd43b}
#gameArea{position:relative;width:min(96vw,1040px);height:min(58vh,560px);min-height:390px;margin:8px auto;border:4px solid rgba(255,255,255,.92);border-radius:28px;background:#16a34a;overflow:hidden;box-shadow:0 24px 55px rgba(0,0,0,.38);touch-action:none}
#gameArea:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 18% 20%,rgba(255,255,255,.16),transparent 16%),
radial-gradient(circle at 75% 70%,rgba(255,255,255,.12),transparent 20%),
linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),
linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:auto,auto,46px 46px,46px 46px;pointer-events:none}
#gameArea:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.05),rgba(255,255,255,.22));pointer-events:none}
.player,.obj,.fx{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;will-change:left,top,transform}
.player{width:52px;height:58px;border:3px solid white;border-radius:18px 18px 24px 24px;font-size:28px;z-index:10;box-shadow:0 8px 0 rgba(0,0,0,.32);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.08));overflow:visible}
.player:after{content:"";position:absolute;left:9px;right:9px;bottom:-8px;height:10px;border-radius:50%;background:rgba(0,0,0,.35);z-index:-1}
.player .face{position:absolute;top:7px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.player .bodyGlow{position:absolute;inset:0;border-radius:15px 15px 21px 21px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.hit{filter:brightness(1.9);transform:scale(1.12) rotate(4deg)}
.tag{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(0,0,0,.58);border-radius:8px;padding:2px 6px;white-space:nowrap}
.obj{z-index:4}
.power{border-radius:18px;border:3px solid white;font-size:25px;box-shadow:0 0 15px rgba(255,255,255,.35);animation:powerFloat 1.5s ease-in-out infinite}
.power.speed{background:linear-gradient(135deg,#22c55e,#bef264)}
.power.shield{background:linear-gradient(135deg,#38bdf8,#1d4ed8)}
.power.score{background:linear-gradient(135deg,#fde047,#f97316)}
.power.sword{background:linear-gradient(135deg,#e5e7eb,#64748b)}
.power.hammer{background:linear-gradient(135deg,#f59e0b,#7c2d12)}
.power.gun{background:linear-gradient(135deg,#a78bfa,#312e81)}
@keyframes powerFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.orb{border-radius:50%;border:3px solid white;background:#22d3ee;font-size:24px;box-shadow:0 0 18px rgba(34,211,238,.6)}.mine{border-radius:50%;border:3px solid #fb7185;background:#111;font-size:24px}.zone{border:5px dashed white;border-radius:20px;background:rgba(250,204,21,.16);font-size:26px}.car{border-radius:14px;background:#ef4444;border:3px solid white;font-size:25px}.ball{border-radius:50%;background:white;border:4px solid #111;font-size:27px}.goal{border:4px dashed white;border-radius:20px;background:rgba(255,255,255,.12);font-size:23px}.decor{font-size:28px;opacity:.85;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}.cloud{font-size:34px;opacity:.72}.tree{font-size:34px}.watermark{font-size:32px;opacity:.35}.fxboom{border-radius:50%;border:4px solid white;background:rgba(255,212,59,.22);font-size:30px;animation:boom .35s forwards}@keyframes boom{to{transform:scale(1.8);opacity:0}}
.hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:7px auto}.h{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:7px 9px;font-weight:900;font-size:13px;box-shadow:0 5px 16px rgba(0,0,0,.16)}
#padWrap{max-width:470px;margin:8px auto}.pad{background:linear-gradient(180deg,rgba(56,189,248,.42),rgba(59,130,246,.34),rgba(15,23,42,.36));border:1px solid rgba(255,255,255,.26);border-radius:26px;padding:10px;box-shadow:0 14px 38px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25)}
.dpad{display:grid;grid-template-columns:76px 76px 76px;grid-template-rows:60px 60px 60px;gap:6px;justify-content:center}.dpad button{padding:0;margin:0;font-size:27px;border-radius:22px;background:linear-gradient(180deg,#fff,#bfdbfe);box-shadow:0 5px 0 #2563eb}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.act{grid-column:2;grid-row:2;background:radial-gradient(circle,#fff,#fde047 38%,#fb923c)!important;box-shadow:0 5px 0 #9a3412!important}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
.perf #gameArea:before,.perf .fx{display:none}.perf .player,.perf .obj{box-shadow:none!important}.perf .card{box-shadow:none}
@media(max-width:760px){html,body{background:
radial-gradient(circle at 15% 0%,#38bdf8 0%,transparent 36%),
radial-gradient(circle at 92% 8%,#fb7185 0%,transparent 28%),
linear-gradient(180deg,#0f3a8a 0%,#0ea5e9 34%,#16a34a 100%)}
.screen{padding:5px 5px 158px}.title{font-size:30px}.card{padding:12px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(15,23,42,.36));border-color:rgba(255,255,255,.28)}
#gameArea{width:98vw;height:50vh;min-height:340px;border-radius:18px;border-width:3px;box-shadow:0 12px 32px rgba(0,0,0,.28)}#padWrap{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:50;width:96vw;max-width:410px;margin:0}.dpad{grid-template-columns:70px 70px 70px;grid-template-rows:55px 55px 55px}.hud .h{font-size:11px;padding:6px}}
</style>
</head>
<body>
<div id="menu" class="screen active"><div class="card">
 <div class="title">🎮 Caos Party V12</div>
 <p><span class="pill">cenários vivos</span><span class="pill">mobile claro</span><span class="pill">personagens</span><span class="pill">conexão melhor</span></p>
 <div id="conn" class="wait">Conectando ao servidor...</div>
 <div class="grid">
  <div class="box"><b>🌐 Criar sala</b><p class="small">Host cria e joga junto.</p><select id="rounds"><option>5</option><option selected>7</option><option>10</option></select><br><button class="blue" onclick="createRoom()">Criar sala</button></div>
  <div class="box"><b>📱 Entrar</b><p class="small">Digite o código.</p><input id="joinCode" placeholder="CÓDIGO"><br><button class="green" onclick="joinRoom()">Entrar</button></div>
 </div>
 <button class="ghost" onclick="togglePerf()">📱 Modo desempenho</button>
</div></div>

<div id="lobby" class="screen"><div class="card">
 <div class="title">🌐 Lobby</div><p>Código:</p><div id="roomCode">----</div><button class="ghost" onclick="copyCode()">Copiar código</button>
 <h3>Escolha seu personagem</h3><div id="chars" class="charGrid"></div>
 <div id="players" class="players"></div>
 <button id="startBtn" onclick="startGame()">Começar partida</button><button class="ghost" onclick="togglePerf()">📱 Modo desempenho</button><button class="ghost" onclick="location.reload()">Voltar</button>
</div></div>

<div id="game" class="screen">
 <div id="roundTitle"></div><h2 id="miniTitle"></h2><div id="notice"></div><div id="hud" class="hud"></div>
 <div id="gameArea"></div>
 <div id="padWrap"><div class="pad"><b id="padLabel">Controle</b><div class="dpad">
  <button class="up" data-k="up">⬆️</button><button class="left" data-k="left">⬅️</button><button class="act" data-k="action">●</button><button class="right" data-k="right">➡️</button><button class="down" data-k="down">⬇️</button>
 </div></div></div>
 <p id="instructions" class="small"></p>
</div>

<div id="result" class="screen"><div class="card"><div class="title">🏆 Resultado</div><h2 id="winner"></h2><div id="ranking"></div><button onclick="location.reload()">Menu</button></div></div>

<script>
const $=id=>document.getElementById(id);
const W=980,H=560, MOBILE=/Android|iPhone|iPad/i.test(navigator.userAgent)||matchMedia("(max-width:760px)").matches;
let perf=localStorage.getItem("perf")==="1"; if(perf)document.body.classList.add("perf");
let socket=null,isHost=false,myId=0,roomCode="",chars=[],players=[],keys={},remote={},round=0,maxRounds=7,miniScores={},objects=[],fx=[],game={},loop=null,timer=null,snapTimer=null,timeLeft=0,lastSend=0,lastRender=0,deck=[],stateSeq=0,lastSeq=0,clientTargets={};
const MINIS=[["orbs","💎 Caça aos Orbes"],["king","👑 Rei da Área"],["mines","💣 Minas Malucas"],["traffic","🚗 Avenida do Caos"],["arena","⚔️ Arena Powerup"],["ball","⚽ Bola Maluca"]];
function show(n){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(n).classList.add("active")}
function togglePerf(){perf=!perf;localStorage.setItem("perf",perf?"1":"0");document.body.classList.toggle("perf",perf);alert(perf?"Modo desempenho ligado":"Modo desempenho desligado")}
function setConn(t,cls){$("conn").textContent=t;$("conn").className=cls}
function boot(){
 if(!window.io){setConn("Erro: Socket.io não carregou. O Render/server.js não está rodando.","bad");return}
 socket=io({transports:["websocket","polling"],timeout:10000,reconnection:true});
 socket.on("connect",()=>{
 const transport=socket.io.engine.transport.name;
 setConn("Servidor conectado ✅ ("+transport+")","ok");
});
socket.io.on("upgrade",()=>setConn("Servidor conectado ✅ ("+socket.io.engine.transport.name+")","ok"));
 socket.on("connect_error",e=>setConn("Erro de conexão: "+e.message,"bad"));
 socket.on("disconnect",()=>setConn("Servidor desconectado/reconectando...","wait"));
 socket.on("lobby",d=>{players=d.players.map(toP);chars=d.chars||chars;renderLobby();renderChars()});
 socket.on("startGame",d=>{players=d.players.map(toP);show("game"); if(!isHost)$("notice").textContent="Aguardando host..."});
 socket.on("playerInput",d=>{if(isHost)remote[d.playerId]=d.input});
 socket.on("gameState",s=>{if(!isHost)applySnap(s)});
 socket.on("gameResult",r=>showResult(r));
 socket.on("hostLeft",()=>{alert("Host saiu");location.reload()});
}
boot();
function emitWithTimeout(event,...args){
 return new Promise(res=>{
  if(!socket||!socket.connected) return res({ok:false,error:"Servidor ainda não conectou. Espere alguns segundos e tente de novo."});
  let done=false;
  const cb=r=>{if(done)return;done=true;res(r)};
  socket.timeout(6000).emit(event,...args,(err,r)=>{if(done)return;done=true; if(err)res({ok:false,error:"Servidor não respondeu. Veja se o Render está live."}); else res(r)});
 });
}
async function createRoom(){
 isHost=true;maxRounds=parseInt($("rounds").value);
 const r=await emitWithTimeout("createRoom");
 if(!r.ok)return alert(r.error);
 setup(r);show("lobby");$("startBtn").style.display="inline-block";
}
async function joinRoom(){
 const c=$("joinCode").value.trim().toUpperCase(); if(!c)return alert("Digite o código");
 isHost=false;const r=await emitWithTimeout("joinRoom",c);
 if(!r.ok)return alert(r.error);
 setup(r);show("lobby");$("startBtn").style.display="none";
}
function setup(r){roomCode=r.code;myId=r.playerId;chars=r.chars||[];players=r.players.map(toP);$("roomCode").textContent=roomCode;renderLobby();renderChars();setupPad()}
function toP(p){return {...p,x:50,y:50,vx:0,vy:0,alive:true,score:p.score||0,stun:0,cool:0,weapon:null,shield:0,lastDx:1,lastDy:0,lastHit:0}}
function renderLobby(){let h="";for(let i=1;i<=4;i++){let p=players.find(x=>x.id===i);h+=p?`<div class=slot><span class=avatar>${p.emoji}</span><b>${p.name}</b><br><span class=ok>Pronto</span></div>`:`<div class=slot><span class=avatar>➕</span><b>Vaga ${i}</b><br><span class=wait>Livre</span></div>`}$("players").innerHTML=h}
function renderChars(){if(!chars.length)return;$("chars").innerHTML=chars.map(c=>`<button class="char ${players.find(p=>p.id===myId&&p.charId===c.id)?"sel":""}" onclick="pickChar(${c.id})">${c.emoji}</button>`).join("")}
function pickChar(id){socket.emit("setCharacter",id)}
function copyCode(){navigator.clipboard&&navigator.clipboard.writeText(roomCode)}
function setupPad(){const st={up:false,down:false,left:false,right:false,action:false};$("padLabel").textContent="Você: "+((players.find(p=>p.id===myId)||{}).emoji||"🎮");document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;let send=v=>{st[k]=v;keys={...st};socket&&socket.emit("input",st)};b.ontouchstart=e=>{e.preventDefault();send(true)};b.ontouchend=e=>{e.preventDefault();send(false)};b.onmousedown=()=>send(true);b.onmouseup=()=>send(false);b.onmouseleave=()=>send(false)})}
addEventListener("keydown",e=>{const m={w:"up",s:"down",a:"left",d:"right"," ":"action",ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){keys[m[e.key]]=true;socket&&socket.emit("input",keys);e.preventDefault()}},{passive:false});
addEventListener("keyup",e=>{const m={w:"up",s:"down",a:"left",d:"right"," ":"action",ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){keys[m[e.key]]=false;socket&&socket.emit("input",keys)}});
function startGame(){if(players.length<2)return alert("Precisa de 2 jogadores");socket.emit("startGame");round=0;show("game");nextRound();snapTimer=setInterval(sendSnap,MOBILE?180:120)}
function refill(){deck=[...MINIS].sort(()=>Math.random()-.5)}
function nextRound(){clearInterval(loop);clearInterval(timer);objects=[];fx=[];miniScores={};players.forEach(p=>{p.alive=true;p.done=false;p.x=60+(p.id-1)*70;p.y=H-85;p.vx=0;p.vy=0;p.score=p.score||0;p.weapon=null;p.shield=0;miniScores[p.id]=0});round++;if(round>maxRounds)return endGame();if(!deck.length)refill();let m=deck.pop();game={id:m[0],title:m[1],teamScore:null};$("roundTitle").textContent=`Rodada ${round}/${maxRounds}`;$("miniTitle").textContent=m[1];initMini(m[0]);loop=setInterval(tick,MOBILE&&perf?45:33);timer=setInterval(()=>{timeLeft--;if(timeLeft<=0)finishRound();renderHud()},1000)}

function setTheme(name){
 const themes={
  orbs:"linear-gradient(160deg,#0891b2,#0f766e 55%,#14532d)",
  king:"linear-gradient(160deg,#f59e0b,#854d0e 55%,#292524)",
  mines:"linear-gradient(160deg,#64748b,#334155 55%,#111827)",
  traffic:"linear-gradient(90deg,#1f2937,#475569,#1f2937)",
  arena:"linear-gradient(160deg,#7e22ce,#1d4ed8 55%,#111827)",
  ball:"linear-gradient(160deg,#16a34a,#15803d 55%,#064e3b)"
 };
 game.bg=themes[name]||"#16a34a";
}
function addDecor(kind){
 if(perf&&MOBILE)return;
 const sets={
  orbs:[["decor",20,25,40,40,"🌴"],["cloud",760,30,70,45,"☁️"],["watermark",470,250,70,70,"💎"]],
  king:[["decor",25,25,42,42,"🔥"],["decor",890,35,42,42,"🏰"],["watermark",470,250,70,70,"👑"]],
  mines:[["decor",35,30,42,42,"⚠️"],["decor",890,40,42,42,"☢️"],["watermark",470,250,70,70,"💣"]],
  traffic:[["decor",25,30,42,42,"🚦"],["decor",895,35,42,42,"🏁"],["watermark",470,250,70,70,"🛣️"]],
  arena:[["decor",25,30,42,42,"⚔️"],["decor",895,35,42,42,"🧰"],["watermark",470,250,70,70,"⚡"]],
  ball:[["decor",25,30,42,42,"🥅"],["decor",895,35,42,42,"🏟️"],["watermark",470,250,70,70,"⚽"]]
 };
 (sets[kind]||[]).forEach(d=>objects.unshift({type:d[0],x:d[1],y:d[2],w:d[3],h:d[4],txt:d[5],decor:true}));
}

function initMini(id){timeLeft=28;$("notice").textContent="";setTheme(id);if(id==="orbs"){objects=[];for(let i=0;i<10;i++)spawn("orb")}if(id==="king"){objects=[{type:"zone",x:350,y:200,w:240,h:155,txt:"👑"}]}if(id==="mines"){objects=[];for(let i=0;i<4;i++)spawn("mineNpc")}if(id==="traffic"){objects=[];for(let i=0;i<(perf&&MOBILE?8:14);i++)objects.push({type:"car",x:120+Math.random()*760,y:80+Math.random()*400,w:70,h:42,vx:(Math.random()<.5?-1:1)*(3+Math.random()*3),txt:"🚗"});objects.push({type:"goal",x:0,y:15,w:W,h:55,txt:"CHEGADA"})}if(id==="arena"){objects=[];for(let i=0;i<6;i++)spawn("power")}if(id==="ball"){objects=[{type:"ball",x:W/2-25,y:H/2-25,w:50,h:50,vx:5,vy:4,txt:"⚽"}]}addDecor(id);spawnPowers()}
function spawn(t){if(t==="orb")objects.push({type:"orb",x:40+Math.random()*(W-90),y:70+Math.random()*(H-140),w:42,h:42,txt:"💎"});if(t==="power"){
 const kinds=[["speed","⚡"],["shield","🛡️"],["score","⭐"],["sword","⚔️"],["hammer","🔨"],["gun","🔫"]];
 const k=kinds[Math.floor(Math.random()*kinds.length)];
 objects.push({type:"power "+k[0],kind:k[0],x:50+Math.random()*(W-100),y:70+Math.random()*(H-140),w:44,h:44,txt:k[1]});
}if(t==="mineNpc")objects.push({type:"mine",x:100+Math.random()*(W-180),y:90+Math.random()*(H-160),w:44,h:44,txt:"💣",armed:20})}
function spawnPowers(){for(let i=0;i<(perf&&MOBILE?1:2);i++)spawn("power")}
function tick(){move();tickPower();if(game.id==="orbs")tickOrbs();if(game.id==="king")tickKing();if(game.id==="mines")tickMines();if(game.id==="traffic")tickTraffic();if(game.id==="arena")tickArena();if(game.id==="ball")tickBall();fade();render()}
function inp(p){return p.id===myId?keys:(remote[p.id]||{})}
function move(){players.forEach(p=>{if(!p.alive)return;if(p.stun>0){p.stun--;p.x=clamp(p.x+p.vx,0,W-46);p.y=clamp(p.y+p.vy,0,H-46);p.vx*=.88;p.vy*=.88;return}let i=inp(p),dx=(i.right?1:0)-(i.left?1:0),dy=(i.down?1:0)-(i.up?1:0);if(dx&&dy){dx*=.707;dy*=.707}if(dx||dy){p.lastDx=dx;p.lastDy=dy}let sp=p.speed?7:5.2;p.speed=Math.max(0,(p.speed||0)-1);p.weaponTime=Math.max(0,(p.weaponTime||0)-1);if(p.weaponTime<=0)p.weapon=null;p.x=clamp(p.x+dx*sp,0,W-46);p.y=clamp(p.y+dy*sp,0,H-46);if(i.action)attack(p)})}
function attack(p){p.cool=Math.max(0,p.cool||0);if(p.cool>0)return;p.cool=p.weapon==="gun"?12:22;if(p.weapon==="gun"){objects.push({type:"bullet",x:p.x+23,y:p.y+23,w:18,h:18,vx:(p.lastDx||1)*11,vy:(p.lastDy||0)*11,owner:p.id,life:55,txt:"•"});return}let range=p.weapon==="sword"?105:80,pow=p.weapon==="hammer"?22:17;boom(p.x-15,p.y-15,p.weapon==="sword"?"⚔️":p.weapon==="hammer"?"🔨":"💥");players.forEach(o=>{if(o.id!==p.id&&dist(p,o)<range){kb(o,p.x+23,p.y+23,pow);miniScores[p.id]=(miniScores[p.id]||0)+2}})}
function kb(p,x,y,pow){if(p.shield){p.shield=0;boom(p.x,p.y,"🛡️");return}let dx=p.x+23-x,dy=p.y+23-y,d=Math.hypot(dx,dy)||1;p.vx=dx/d*pow;p.vy=dy/d*pow;p.stun=14;p.lastHit=Date.now();boom(p.x-15,p.y-15,"💥")}
function boom(x,y,txt){if(perf&&MOBILE)return;fx.push({type:"fxboom",x,y,w:76,h:76,txt,life:10})}
function tickPower(){for(let oi=objects.length-1;oi>=0;oi--){let o=objects[oi];if(o.type!=="power")continue;for(let p of players){if(hitP(p,o)){applyPower(p,o.kind);objects.splice(oi,1);setTimeout(()=>isHost&&spawn("power"),2600);break}}}}
function applyPower(p,k){if(k==="speed")p.speed=180;if(k==="shield")p.shield=1;if(k==="score")miniScores[p.id]=(miniScores[p.id]||0)+5;if(k==="sword"){p.weapon="sword";p.weaponTime=220}if(k==="hammer"){p.weapon="hammer";p.weaponTime=220}if(k==="gun"){p.weapon="gun";p.weaponTime=180}const names={speed:"velocidade ⚡",shield:"escudo 🛡️",score:"bônus ⭐",sword:"espada ⚔️",hammer:"marreta 🔨",gun:"arma 🔫"};
$("notice").textContent=`${p.emoji} pegou ${names[k]||k}!`}
function tickOrbs(){for(let oi=objects.length-1;oi>=0;oi--){let o=objects[oi];if(o.type!=="orb")continue;for(let p of players){if(hitP(p,o)){miniScores[p.id]=(miniScores[p.id]||0)+2;objects.splice(oi,1);spawn("orb");break}}}}
function tickKing(){let z=objects.find(o=>o.type==="zone");if(timeLeft%7===0&&Math.random()<.04){z.x=80+Math.random()*(W-340);z.y=80+Math.random()*(H-250)}players.forEach(p=>{if(z&&p.x+23>z.x&&p.x+23<z.x+z.w&&p.y+23>z.y&&p.y+23<z.y+z.h)miniScores[p.id]=(miniScores[p.id]||0)+.12})}
function tickMines(){objects.forEach(o=>{if(o.type==="mine"){o.armed--;if(o.armed<=0)o.armed=50;players.forEach(p=>{if(hitP(p,o)){miniScores[p.id]=(miniScores[p.id]||0)-2;kb(p,o.x+22,o.y+22,20)}})}})}
function tickTraffic(){objects.forEach(o=>{if(o.type==="car"){o.x+=o.vx;if(o.x<-90)o.x=W+90;if(o.x>W+90)o.x=-90;players.forEach(p=>{if(hitP(p,o)){miniScores[p.id]-=3;kb(p,o.x+35,o.y+21,20)}})}});players.forEach(p=>{if(p.y<70){miniScores[p.id]+=10;p.y=H-85}})}
function tickArena(){players.forEach(p=>{});handleBullets()}
function tickBall(){let b=objects.find(o=>o.type==="ball");b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>W-b.w)b.vx*=-1;if(b.y<0||b.y>H-b.h)b.vy*=-1;players.forEach(p=>{if(hitP(p,b)){miniScores[p.id]-=3;kb(p,b.x+25,b.y+25,18)}})}
function handleBullets(){for(let oi=objects.length-1;oi>=0;oi--){let b=objects[oi];if(b.type!=="bullet")continue;b.x+=b.vx;b.y+=b.vy;b.life--;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){objects.splice(oi,1);continue}players.forEach(p=>{if(p.id!==b.owner&&hitP(p,b)){miniScores[b.owner]+=3;kb(p,b.x,b.y,16);objects.splice(oi,1)}})}}
function fade(){fx.forEach(f=>f.life--);fx=fx.filter(f=>f.life>0);players.forEach(p=>p.cool=Math.max(0,(p.cool||0)-1))}
function finishRound(){clearInterval(loop);clearInterval(timer);let order=[...players].sort((a,b)=>(miniScores[b.id]||0)-(miniScores[a.id]||0));[10,7,4,2].forEach((pt,i)=>{if(order[i])order[i].score+=pt});$("notice").textContent="Fim!";sendSnap(true);setTimeout(nextRound,1600)}
function endGame(){clearInterval(snapTimer);socket.emit("gameResult",players.map(p=>({id:p.id,name:p.name,emoji:p.emoji,color:p.color,score:p.score})));showResult(players)}
function sendSnap(force=false){
if(!isHost)return;
let now=performance.now();
if(!force&&now-lastSend<(MOBILE&&perf?170:85))return;
lastSend=now;
stateSeq++;
socket.emit("gameState",packState());
})}

function packPlayer(p){
 return {id:p.id,name:p.name,emoji:p.emoji,color:p.color,charId:p.charId,score:p.score||0,x:Math.round(p.x),y:Math.round(p.y),alive:p.alive,weapon:p.weapon||null,shield:p.shield||0,lastHit:p.lastHit||0};
}
function packObj(o){
 const n={type:o.type,x:Math.round(o.x),y:Math.round(o.y),w:Math.round(o.w),h:Math.round(o.h)};
 if(o.txt)n.txt=o.txt;if(o.kind)n.kind=o.kind;if(o.owner)n.owner=o.owner;if(o.vx)n.vx=Math.round(o.vx*10)/10;if(o.vy)n.vy=Math.round(o.vy*10)/10;if(o.life)n.life=o.life;if(o.armed)n.armed=o.armed;
 return n;
}
function packState(){
 return {seq:stateSeq,round,maxRounds,game,timeLeft,players:players.map(packPlayer),objects:objects.map(packObj),fx:perf?[]:fx.map(packObj),miniScores,notice:$("notice").textContent,inst:$("instructions").textContent};
}

function applySnap(s){
if(s.seq && s.seq<lastSeq)return;
lastSeq=s.seq||lastSeq;
round=s.round;maxRounds=s.maxRounds;game=s.game;timeLeft=s.timeLeft;objects=s.objects||[];fx=s.fx||[];miniScores=s.miniScores||{};
const oldById={};players.forEach(p=>oldById[p.id]=p);
players=(s.players||[]).map(np=>{
 const old=oldById[np.id];
 if(old){
   clientTargets[np.id]={x:np.x,y:np.y};
   return {...old,...np,x:old.x+(np.x-old.x)*0.55,y:old.y+(np.y-old.y)*0.55};
 }
 clientTargets[np.id]={x:np.x,y:np.y};
 return np;
});
$("roundTitle").textContent=`Rodada ${round}/${maxRounds}`;$("miniTitle").textContent=game.title;$("notice").textContent=s.notice||"";render(true)}/${maxRounds}`;$("miniTitle").textContent=game.title;$("notice").textContent=s.notice||"";render(true)}
function render(force=false){let now=performance.now();if(perf&&MOBILE&&!force&&now-lastRender<100)return;lastRender=now;
if(!isHost){players.forEach(p=>{let t=clientTargets[p.id];if(t){p.x=p.x+(t.x-p.x)*0.25;p.y=p.y+(t.y-p.y)*0.25}})}
let ga=$("gameArea");ga.innerHTML="";objects.forEach(o=>draw(o.type,o));players.forEach(p=>drawP(p));if(!perf)fx.forEach(o=>draw(o.type,o));renderHud()}
function draw(cls,o){let e=document.createElement("div");e.className="obj "+cls;e.textContent=o.txt||"";e.style.left=o.x/W*100+"%";e.style.top=o.y/H*100+"%";e.style.width=o.w/W*100+"%";e.style.height=o.h/H*100+"%";$("gameArea").appendChild(e)}
function drawP(p){
let e=document.createElement("div");
e.className="player "+(Date.now()-p.lastHit<180?"hit":"");
e.style.background=`linear-gradient(180deg,rgba(255,255,255,.24),${p.color})`;
e.innerHTML=`<span class=tag>${p.name}</span><span class=bodyGlow></span><span class=face>${p.emoji}</span>${p.weapon?`<span style="position:absolute;bottom:-19px;font-size:14px">${p.weapon==="sword"?"⚔️":p.weapon==="hammer"?"🔨":"🔫"}</span>`:""}${p.shield?`<span style="position:absolute;right:-8px;top:-8px">🛡️</span>`:""}`;
e.style.left=p.x/W*100+"%";e.style.top=p.y/H*100+"%";$("gameArea").appendChild(e)}</span>${p.emoji}${p.weapon?`<span style="position:absolute;bottom:-19px;font-size:14px">${p.weapon==="sword"?"⚔️":p.weapon==="hammer"?"🔨":"🔫"}</span>`:""}${p.shield?`<span style="position:absolute;right:-8px;top:-8px">🛡️</span>`:""}`;e.style.left=p.x/W*100+"%";e.style.top=p.y/H*100+"%";$("gameArea").appendChild(e)}
function renderHud(){$("hud").innerHTML=players.map(p=>`<div class=h>${p.emoji} ${p.name}: ${p.score} <span class=small>(${Math.floor(miniScores[p.id]||0)})</span></div>`).join("")}
function showResult(ps){show("result");let r=[...ps].sort((a,b)=>b.score-a.score);$("winner").textContent=`Campeão: ${r[0].emoji} ${r[0].name}`;$("ranking").innerHTML=r.map((p,i)=>`<p>${i+1}. ${p.emoji} ${p.name} — ${p.score} pts</p>`).join("")}
function hit(a,b){return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h)}function hitP(p,o){return hit({x:p.x,y:p.y,w:46,h:46},o)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
</script>
